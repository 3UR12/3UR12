name: Update profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate_profile_activity.py"
      - ".github/workflows/update-profile-activity.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate activity SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_profile_activity.py

      - name: Commit refreshed assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-activity-dark.svg assets/profile-activity-light.svg

          if git diff --cached --quiet; then
            echo "Activity assets are already up to date."
            exit 0
          fi

          git commit -m "chore: refresh profile activity"
          git pull --rebase origin main
          git push origin HEAD:main
